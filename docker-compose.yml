services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pilketos-v2-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/ci4-default.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/ports-8081.conf:/etc/apache2/ports.conf:ro
    ports:
      - "8081:8081"
    environment:
      APP_URL: http://localhost:8081/
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: db_pilketos
      CI_ENV: development
    depends_on:
      - db
    command: >
      bash -lc "a2dissite 000-default || true && a2ensite 000-default && a2enmod rewrite headers && apache2-foreground"
    restart: unless-stopped
    networks:
      - default
      - network_app

  db:
    image: mysql:8.0
    container_name: pilketos-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: db_pilketos
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/db_pilketos.sql:/docker-entrypoint-initdb.d/01-db_pilketos.sql:ro
    restart: unless-stopped

volumes:
  dbdata:

networks:
  network_app:
    external: true
